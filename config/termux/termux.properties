# =============================================================================
# ~/.termux/termux.properties — ajustes de la app Termux
# Aplicar con: termux-reload-settings (o reiniciar la app)
# =============================================================================

# Sin campana (ni sonido ni vibración)
bell-character=ignore

# Cursor de terminal: bloque parpadeante
terminal-cursor-style=block
terminal-cursor-blink-rate=500

# Tecla "atrás" = ESC
back-key=escape

# Fila de teclas extra: ESC TAB CTRL ALT + flechas y paginación
extra-keys = [ \
  ['ESC','/','-','HOME','UP','END','PGUP'], \
  ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN'] \
]

# Margen interno del terminal (dp)
terminal-margin-horizontal=4
terminal-margin-vertical=2
