# =============================================================================
# ~/.config/starship.toml — prompt minimalista morado/azul pastel
# Segmentos: icono OS · carpeta · rama git · estado git
# =============================================================================

format = "$os$directory$git_branch$git_status$character"
right_format = "$cmd_duration"
add_newline = true
command_timeout = 500

[palettes.pastel_night]
purple  = "#bb9af7"   # lila principal
blue    = "#7aa2f7"   # azul pastel
cyan    = "#7dcfff"
fg      = "#c0caf5"
mauve   = "#9d7cd8"
green   = "#9ece6a"
red     = "#f7768e"
yellow  = "#e0af68"

palette = "pastel_night"

# ── Icono del sistema ────────────────────────────────────────────────────────
[os]
disabled = false
style = "fg:purple"
format = "[$symbol]($style) "

[os.symbols]
Android = ""
Linux   = ""

# ── Carpeta actual ───────────────────────────────────────────────────────────
[directory]
style = "bold fg:blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
read_only = " "
read_only_style = "fg:red"

[directory.substitutions]
"storage/shared" = "󱍶 shared"

# ── Git: rama ────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "fg:mauve"
format = "[on ](fg:fg)[$symbol$branch(:$remote_branch)]($style) "

# ── Git: estado ──────────────────────────────────────────────────────────────
[git_status]
style = "fg:purple"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "\\$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ── Carácter del prompt ──────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold fg:purple)"
error_symbol   = "[❯](bold fg:red)"
vimcmd_symbol  = "[❮](bold fg:blue)"

# ── Duración de comandos (derecha) ───────────────────────────────────────────
[cmd_duration]
min_time = 2000
style = "dimmed fg:yellow"
format = "[$duration]($style)"
